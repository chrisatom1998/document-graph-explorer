name: Combine tagger runs

# Builds the app's browser tagger from several training runs (scripts/audio-model/combine.py: per tag, the run that scored
# best on held-out audio), scores it on the held-out sets and publishes it to a public Hugging Face model repo, on a
# Hugging Face Jobs CPU machine billed to the HF_TOKEN account.
on:
  workflow_dispatch:
    inputs:
      runs: { description: 'folders of the private dge-instrument-tagger repo, the shipped run first', default: 'all-tags all-tags-run5' }
      keep: { description: 'tags that stay with the shipped run', default: 'drums' }
      public_repo: { description: 'public model repo to publish to (under the HF_TOKEN account)', default: 'dge-all-tags-tagger-nc' }
      license: { description: 'licence of the published weights (cc-by-nc-sa-4.0 when a run used Mixing Secrets)', default: 'cc-by-nc-sa-4.0' }
      flavor: { default: 'cpu-upgrade' }
      timeout: { default: '2h' }
  push:   # a new workflow can't be dispatched before it reaches main: push a changed combine-request.json instead
    branches: ['claude/**']
    paths: ['scripts/audio-model/combine-request.json']

permissions:
  contents: read

jobs:
  combine:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Combine, score and publish on Hugging Face Jobs
        env:
          HF_TOKEN: '${{ secrets.HF_TOKEN }}'
          # Dispatch inputs reach the script as variables, never as script text.
          IN_RUNS: '${{ inputs.runs }}'
          IN_KEEP: '${{ inputs.keep }}'
          IN_REPO: '${{ inputs.public_repo }}'
          IN_LICENSE: '${{ inputs.license }}'
          IN_FLAVOR: '${{ inputs.flavor }}'
          IN_TIMEOUT: '${{ inputs.timeout }}'
        run: |
          pip install -q huggingface_hub
          if [ "${{ github.event_name }}" = push ]; then
            read RUNS KEEP REPO LICENSE FLAVOR TIMEOUT < <(python3 -c "import json; r = json.load(open('scripts/audio-model/combine-request.json')); print(' '.join([','.join(r['runs']), r.get('keep', 'drums'), r.get('public_repo', 'dge-all-tags-tagger'), r.get('license', 'mit'), r.get('flavor', 'cpu-upgrade'), r.get('timeout', '2h')]))")
            RUNS=${RUNS//,/ }
            ONLY=$(python3 -c 'import json; r = json.load(open("scripts/audio-model/combine-request.json")); print(";".join(k + "=" + ",".join(v) for k, v in r.get("only", {}).items()))')
          else
            RUNS="$IN_RUNS"; KEEP="$IN_KEEP"; REPO="$IN_REPO"; LICENSE="$IN_LICENSE"; FLAVOR="$IN_FLAVOR"; TIMEOUT="$IN_TIMEOUT"
          fi
          USER=$(python3 -c "from huggingface_hub import whoami; print(whoami()['name'])")
          python3 scripts/audio-model/hf-launch.py "$FLAVOR" "$TIMEOUT" REPO_SHA=${{ github.sha }} JOB_SCRIPT=hf-combine-job.sh JOB_NAME=dge-tagger-combine \
            "RUNS=$RUNS" "KEEP=$KEEP" "ONLY=${ONLY:-}" "PUBLIC_REPO=$USER/$REPO" "LICENSE=$LICENSE"
