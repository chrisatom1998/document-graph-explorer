name: Train the audio tagger

# Fine-tunes DGE's own sound tagger (OpenMIC 20 classes + MTG-Jamendo's 40 instrument tags, and with all_tags the app-named
# head taught by FSD50K, NSynth, effect renders, Freesound, TinySOL, EGFxSet, FSLD, WaivOps and Surge) on a Hugging Face Jobs GPU, billed to the HF_TOKEN
# account, and uploads the run to that account's private dge-instrument-tagger model repo. OpenMIC and MTG-Jamendo
# audio is fetched inside the job. The SoundCloud set's audio only exists as Actions artifacts, so this workflow turns
# its train fold into log-mel windows (no audio leaves GitHub) for the job, and scores its held-out fold here after.
# Scores are printed as aggregates only.
on:
  workflow_dispatch:
    inputs:
      flavor: { description: 'HF Jobs hardware', default: 'l4x1' }
      model: { description: 'EfficientAT backbone', default: 'mn10_as' }
      epochs: { default: '15' }
      lr: { default: '1e-4' }
      batch: { default: '64' }
      weak: { description: 'weight of untagged (weak) absences', default: '0.2' }
      rawstems: { description: 'add Mixing Secrets full songs (non-commercial licence: weights must be published CC BY-NC-SA)', default: 'false' }
      rare_repeat: { description: 'times each bass/organ/cello/trumpet/violin/sax window is seen per epoch', default: '1' }
      soundcloud: { description: 'add the SoundCloud train fold (artifacts of run 37413702012)', default: 'true' }
      all_tags: { description: 'add the app-named head (FSD50K, NSynth, effect renders)', default: 'true' }
      init_from: { description: 'start from an earlier run: <model repo>[@<revision>[/<folder>]], empty for AudioSet weights', default: '' }
      out_dir: { description: 'folder of the model repo for this run (empty: the root)', default: 'all-tags' }
      timeout: { description: 'HF job time limit', default: '7h' }
      job_hours: { description: 'the time limit above in hours (training fits inside it)', default: '7' }
      train_hours: { description: 'training time budget inside the job; epochs are cut to fit', default: '4.25' }
      charts: { description: 'live training charts (loss, validation mAP) in the private dge-training-charts Space', default: 'true' }
  push:
    branches: ['claude/train-audio-model-*']
    paths: ['.github/workflows/audio-model-train.yml']

permissions:
  contents: read
  actions: read

env:
  SC_RUN: '37413702012'
  SC_MANIFEST: https://raw.githubusercontent.com/chrisatom1998/document-graph-explorer/61b32521e82f53c1f16d409bb9585120cec96804/docs/evaluations/soundcloud-2026-10-06/manifest.json
  EFFICIENTAT_SHA: a425fdce92572e602a1d5634799bd9f1f2efa806

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
      - name: Check the Hugging Face token
        env: { HF_TOKEN: '${{ secrets.HF_TOKEN }}' }
        run: |
          [ -n "$HF_TOKEN" ] || { echo "::error::Add a Hugging Face token as the repository secret HF_TOKEN"; exit 1; }
          pip install -q huggingface_hub
          python3 -c "from huggingface_hub import whoami; w = whoami(); print('HF account:', w['name'], '| PRO:', w.get('isPro'))"
      - name: Fetch the SoundCloud excerpts
        if: ${{ (inputs.soundcloud || 'true') == 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: sc-audio-*
          merge-multiple: true
          path: sc-audio
          run-id: ${{ env.SC_RUN }}
          github-token: ${{ github.token }}
      - name: Prepare the SoundCloud windows and upload the train fold's log-mels
        if: ${{ (inputs.soundcloud || 'true') == 'true' }}
        env: { HF_TOKEN: '${{ secrets.HF_TOKEN }}' }
        run: |
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q numpy onnxruntime
          git clone -q https://github.com/fschmid56/EfficientAT.git && git -C EfficientAT checkout -q $EFFICIENTAT_SHA
          find sc-audio -name '*.mp3' -exec mv -n {} sc-audio/ \;
          curl -fsSL --retry 6 -o sc-manifest.json "$SC_MANIFEST"
          EFFICIENTAT=EfficientAT python3 scripts/audio-model/prepare-soundcloud.py sc-manifest.json sc-audio sc-prep
          python3 - <<'EOF' >> "$GITHUB_ENV"
          import os
          from huggingface_hub import HfApi
          api = HfApi(); repo = api.whoami()['name'] + '/dge-tagger-data'; folder = 'soundcloud-' + os.environ['GITHUB_SHA'][:7]
          api.create_repo(repo, repo_type='dataset', private=True, exist_ok=True)
          api.upload_folder(repo_id=repo, repo_type='dataset', folder_path='sc-prep', path_in_repo=folder,
                            allow_patterns=['soundcloud-mel.npy', 'soundcloud.json'], commit_message='SoundCloud train-fold log-mels')
          print(f'SOUNDCLOUD_DATA={repo}:{folder}')
          EOF
      - name: Train on Hugging Face Jobs
        env: { HF_TOKEN: '${{ secrets.HF_TOKEN }}' }
        run: >
          python3 scripts/audio-model/hf-launch.py "${{ inputs.flavor || 'l4x1' }}" "${{ inputs.timeout || '7h' }}"
          REPO_SHA=${{ github.sha }} MODEL=${{ inputs.model || 'mn10_as' }} EPOCHS=${{ inputs.epochs || '15' }}
          ALL_TAGS=${{ (inputs.all_tags || 'true') == 'true' && '1' || '0' }} INIT_FROM=${{ github.event_name != 'push' && inputs.init_from || '' }}
          OUT_DIR=${{ github.event_name == 'push' && 'all-tags' || inputs.out_dir }} JOB_NAME=dge-tagger-${{ github.event_name == 'push' && 'all-tags' || inputs.out_dir || 'main' }}
          TRAIN_HOURS=${{ inputs.train_hours || '4.25' }} RARE_REPEAT=${{ inputs.rare_repeat || '1' }} RAWSTEMS=${{ inputs.rawstems == 'true' && '1' || '0' }} JOB_HOURS=${{ inputs.job_hours || '7' }}
          LR=${{ inputs.lr || '1e-4' }} BATCH=${{ inputs.batch || '64' }} WEAK=${{ inputs.weak || '0.2' }}
          SOUNDCLOUD_DATA=${SOUNDCLOUD_DATA:-} TRACKIO_SPACE=${{ (inputs.charts || 'true') == 'true' && '1' || '' }}
      - name: Stop the Hugging Face job if this workflow is cancelled
        if: ${{ cancelled() }}
        env: { HF_TOKEN: '${{ secrets.HF_TOKEN }}' }
        run: |
          if [ -f hf-job-id ]; then python3 -c "from huggingface_hub import cancel_job; cancel_job(job_id=open('hf-job-id').read())"; fi
      - name: Score the SoundCloud held-out fold
        if: ${{ (inputs.soundcloud || 'true') == 'true' && hashFiles('hf-job-detached') == '' }}
        env: { HF_TOKEN: '${{ secrets.HF_TOKEN }}' }
        run: |
          D="${{ github.event_name == 'push' && 'all-tags' || inputs.out_dir }}"; P=${D:+$D/}
          python3 -c "import sys; from huggingface_hub import snapshot_download as d, whoami; d(whoami()['name'] + '/dge-instrument-tagger', allow_patterns=[sys.argv[1] + 'onnx/*', sys.argv[1] + 'thresholds.json'], local_dir='tagger')" "$P"
          python3 scripts/audio-model/evaluate.py tagger/${P}onnx/model.onnx tagger/${P}thresholds.json sc-eval.json sc-prep/soundcloud-heldout
