name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build standard app
        run: npm run build

      - name: Build air-gapped app
        run: npm run build:airgap

      - name: Build portable Windows runtime (pkg)
        run: npm run build:exe

      - name: Build Electron Windows portable
        run: npx electron-builder --win portable

      - name: Guard tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Package artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          zip -r dist.zip dist
          zip -r dist-airgap.zip dist-airgap
          zip -r "Document-Graph-Explorer-${VERSION}-win-pkg.zip" release/win
          # Portable target lands as release/<productName>-<version>.exe (maxdepth 1).
          # Do not scan win-unpacked/: that tree also has tiny helper exes (e.g. elevate.exe).
          EXE="$(find release -maxdepth 1 -type f -name '*.exe' | head -1)"
          if [ -z "$EXE" ]; then
            echo "Electron portable exe not found under release/" >&2
            exit 1
          fi
          cp "$EXE" "Document.Graph.Explorer-${VERSION}.exe"
          zip -9 "Document-Graph-Explorer-${GITHUB_REF_NAME}-windows-x64-portable.zip" \
            "Document.Graph.Explorer-${VERSION}.exe"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            dist.zip \
            dist-airgap.zip \
            "Document-Graph-Explorer-${VERSION}-win-pkg.zip" \
            "Document-Graph-Explorer-${GITHUB_REF_NAME}-windows-x64-portable.zip" \
            "Document.Graph.Explorer-${VERSION}.exe" \
            --generate-notes
