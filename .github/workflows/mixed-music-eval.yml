name: Mixed-music tag check

# Measures what the Sounds panel shows on full-mix music: a frozen set of 10 s OpenMIC-2018 test clips
# (one per artist, CC-BY/CC0, human instrument labels). "base" builds the app source at BASE_REF, "branch" at
# this commit; both use this commit's scripts. The first run freezes and commits the manifest; audio is fetched at run
# time and never committed.
on:
  push:
    branches: [claude/weak-sound-labels-2phv35]
    paths: [scripts/mixed-music/build.py]
  workflow_dispatch:

permissions:
  contents: write

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  BASE_REF: d1b7b05928804975802348288f29384ce5a40245
  OPENMIC: https://zenodo.org/records/1432913/files/openmic-2018-v1.0.0.tgz?download=1
  MUSIC_MODEL_PATHS: |
    public/music-model/**/*.onnx
    public/sound-model/**/*.onnx
    public/jamendo-model/*.onnx
    !public/jamendo-model/nsynth_*-discogs-effnet-1.onnx

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Download OpenMIC-2018
        run: |
          curl -fsSL --retry 6 -o "$RUNNER_TEMP/openmic.tgz" "$OPENMIC"
          echo "e4ccf187e2bb5ab2e115416e8aafe7f4  $RUNNER_TEMP/openmic.tgz" | md5sum -c -
      - name: Select clips
        run: python3 scripts/mixed-music/build.py "$RUNNER_TEMP/openmic.tgz" mixed-audio
      - name: Commit the frozen manifest
        run: |
          git add docs/evaluations/mixed-music-2026-10-05/manifest.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Freeze the mixed-music tag benchmark (OpenMIC test clips)"
            for i in 1 2 3 4; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break; sleep $((2**i)); done
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: mixed-music-audio
          path: |
            mixed-audio
            docs/evaluations/mixed-music-2026-10-05/manifest.json
          retention-days: 7

  eval:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        build: [base, branch]
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: mixed-music-audio
          path: mm
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore audio model weights
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.MUSIC_MODEL_PATHS }}
          key: music-models-${{ hashFiles('public/*-model/manifest.json') }}
          restore-keys: music-models-
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Use the base app source
        if: matrix.build == 'base'
        run: git checkout "$BASE_REF" -- src
      - name: Build
        run: npm run build
      - name: Analyse in the real app
        run: |
          export CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          AUDIO_DIR=mm/mixed-audio AUDIO_EXT=ogg MANIFEST=mm/docs/evaluations/mixed-music-2026-10-05/manifest.json SHARD=${{ matrix.shard }}/3 \
            node scripts/short-clip-upload-eval.mjs out/run test 20
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mixed-music-${{ matrix.build }}-${{ matrix.shard }}
          path: out/run/graph-export.json
          retention-days: 30

  score:
    needs: eval
    # Score whatever shards finished, but not when the freeze failed and nothing ran.
    if: ${{ !cancelled() && needs.eval.result != 'skipped' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build: [base, branch]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          pattern: mixed-music-${{ matrix.build }}-*
          path: exports
      - uses: actions/download-artifact@v7
        with:
          name: mixed-music-audio
          path: mm
      - name: Score
        run: |
          # download-artifact v5+ extracts a sole matching artifact directly into exports.
          # Keep scoring all available shards, including a run where only one uploaded.
          shopt -s nullglob
          exports=(exports/mixed-music-${{ matrix.build }}-*/graph-export.json)
          if [ -f exports/graph-export.json ]; then exports+=(exports/graph-export.json); fi
          test "${#exports[@]}" -gt 0 || { echo "No graph exports to score" >&2; exit 1; }
          MANIFEST=mm/docs/evaluations/mixed-music-2026-10-05/manifest.json npx vite-node scripts/mixed-music/score.mjs report.json "${exports[@]}"
          set -o pipefail; node scripts/compare-tag-reports.mjs --min-positives 5 report.json
      - uses: actions/upload-artifact@v6
        with:
          name: mixed-music-report-${{ matrix.build }}
          path: report.json
          retention-days: 30

  compare:
    # Base and branch side by side; fails if any label that passes 60/60 on base fails on the branch.
    needs: score
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: mixed-music-report-*
          path: reports
      - name: Compare
        run: |
          cp reports/mixed-music-report-base/report.json base.json
          cp reports/mixed-music-report-branch/report.json branch.json
          set -o pipefail; node scripts/compare-tag-reports.mjs --min-positives 5 base.json branch.json | tee compare.txt
          ! grep -q 'branch: now fails' compare.txt

