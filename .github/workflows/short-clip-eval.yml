name: Short-clip tag check

# Re-measures what the Sounds panel shows on the frozen short-clip benchmark
# (docs/evaluations/short-clips-2026-10-04): uploads each clip into the built app in headless Chromium,
# exports the graph and scores the displayed tags. "base" builds the app source at BASE_REF, "branch" at
# this commit; both use this commit's scoring scripts. Audio is fetched at run time and never committed.
on:
  workflow_dispatch:

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  BASE_REF: d1b7b05928804975802348288f29384ce5a40245
  MUSIC_MODEL_PATHS: |
    public/music-model/**/*.onnx
    public/sound-model/**/*.onnx
    public/jamendo-model/*.onnx
    !public/jamendo-model/nsynth_*-discogs-effnet-1.onnx

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        build: [base, branch]
        split: [calibration, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore audio model weights
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MUSIC_MODEL_PATHS }}
          key: music-models-${{ hashFiles('public/*-model/manifest.json') }}
          restore-keys: music-models-
      - name: Install ffmpeg + Playwright Chromium
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npx playwright install --with-deps chromium
      - name: Fetch benchmark audio
        run: python3 scripts/short-clip-fetch-audio.py "$RUNNER_TEMP/clips" ${{ matrix.split }} "$RUNNER_TEMP/sources"
      - name: Use the base app source
        if: matrix.build == 'base'
        run: git checkout "$BASE_REF" -- src && git status --short | head
      - name: Build
        run: npm run build
      - name: Analyse in the real app
        run: |
          export CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          AUDIO_DIR="$RUNNER_TEMP/clips" node scripts/short-clip-upload-eval.mjs out/run ${{ matrix.split }} 60
      - name: Score
        if: always()
        run: |
          git checkout HEAD -- src
          npx vite-node scripts/short-clip-displayed.mjs out/run/graph-export.json out/run/r
          python3 scripts/short-clip-report.py out/run ${{ matrix.split }} > out/report.json
          set -o pipefail; node scripts/compare-tag-reports.mjs out/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-clip-${{ matrix.build }}-${{ matrix.split }}
          path: |
            out/report.json
            out/run/run.json
            out/run/r-*.json
          retention-days: 30

  compare:
    # Base and branch side by side per split; fails if any label that passes 60/60 on base fails on the branch.
    needs: eval
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        split: [calibration, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: short-clip-*-${{ matrix.split }}
          path: reports
      - name: Compare
        run: |
          cp reports/short-clip-base-${{ matrix.split }}/report.json base.json
          cp reports/short-clip-branch-${{ matrix.split }}/report.json branch.json
          set -o pipefail; node scripts/compare-tag-reports.mjs base.json branch.json | tee compare.txt
          ! grep -q 'branch: now fails' compare.txt
