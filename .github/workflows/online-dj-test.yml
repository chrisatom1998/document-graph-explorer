name: Online DJ tag check

# Real-world check: the frozen list of 15 s clips from Creative Commons SoundCloud tracks
# (scripts/online-dj/soundcloud-clips.json) runs through the built app's real analysis pipeline
# in headless Chromium, once per app version, so before/after see identical audio.
# Audio is fetched at run time and never committed.
on:
  push:
    branches: [claude/edm-genre-tags-5qvvso]
    paths: [scripts/online-dj/**, .github/workflows/online-dj-test.yml]
  workflow_dispatch:

permissions:
  contents: write

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  MUSIC_MODEL_PATHS: |
    public/music-model/**/*.onnx
    public/sound-model/**/*.onnx
    public/jamendo-model/*.onnx
    !public/jamendo-model/nsynth_*-discogs-effnet-1.onnx

jobs:
  online-dj:
    strategy:
      fail-fast: false
      matrix:
        app: [main, branch]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.app == 'main' && 'main' || github.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          path: online-dj-tools
      - name: Use this branch's test scripts against the app version under test
        run: |
          rm -rf scripts/online-dj && cp -r online-dj-tools/scripts/online-dj scripts/online-dj
          cp online-dj-tools/scripts/full-mix/extract.mjs online-dj-extract.mjs && rm -rf online-dj-tools
          git log -1 --format='app under test: %H %s'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore audio model weights
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MUSIC_MODEL_PATHS }}
          key: music-models-${{ hashFiles('public/*-model/manifest.json') }}
          restore-keys: music-models-
      - name: Download any missing model weights
        run: npm run setup:music
      - name: Install ffmpeg, yt-dlp + Playwright Chromium
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet --upgrade yt-dlp
          npx playwright install --with-deps chromium
      - name: Fetch the frozen SoundCloud clips
        run: node scripts/online-dj/refetch-soundcloud.mjs online-dj/audio online-dj/manifest.json
      - name: Build
        run: npm run build
      - name: Analyse in the real app
        run: |
          export CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          AUDIO_DIR=online-dj/audio MANIFEST=online-dj/manifest.json node scripts/online-dj/upload-eval.mjs online-dj/run test 20
      - name: Summarise
        if: always()
        run: npx vite-node scripts/online-dj/summarize.mjs online-dj/run/graph-export.json online-dj/manifest.json online-dj/summary.json
      - name: Extract
        if: always()
        run: |
          mkdir -p scripts/full-mix && cp online-dj-extract.mjs scripts/full-mix/extract.mjs
          npx vite-node scripts/full-mix/extract.mjs online-dj/soundcloud-${{ matrix.app }}.json online-dj/run/graph-export.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soundcloud-${{ matrix.app }}
          path: online-dj/soundcloud-${{ matrix.app }}.json
          retention-days: 14

  commit:
    needs: online-dj
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: soundcloud-*
          path: records
          merge-multiple: true
      - name: Commit the compact records
        run: |
          mkdir -p docs/evaluations/edm-genre-tags-2026-10-05
          cp records/*.json docs/evaluations/edm-genre-tags-2026-10-05/
          git add docs/evaluations/edm-genre-tags-2026-10-05
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Online DJ check: SoundCloud records, main and branch"
          for i in 1 2 3 4; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break; sleep $((2**i)); done
