name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # One group per PR branch: a newer push supersedes the run in flight. Each
  # push to main gets its own group so every merge is tested. A shared group
  # would not do: GitHub keeps at most one pending run per group, so with
  # merges landing minutes apart a third push would still drop the second
  # (and cancelling left main without a completed run for hours, which hid a
  # broken e2e suite).
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # These builds need the audio model pack.
  DGE_MODELS: full
  # onnxruntime-node (pulled in transitively) otherwise downloads the CUDA binaries from
  # api.nuget.org in its postinstall on every run. CI only uses the CPU build, and that
  # host has timed out npm ci on hosted runners more than once.
  ONNXRUNTIME_NODE_INSTALL: skip
  # Gitignored, checksum-verified optional weights fetched by `npm run models:audio`.
  MUSIC_MODEL_PATHS: |
    public/audio-model-pack.json
    public/music-model/**/*.onnx
    public/sound-model/**/*.onnx
    public/jamendo-model/*.onnx
    public/tagger-model/*.onnx
    !public/jamendo-model/nsynth_*-discogs-effnet-1.onnx

jobs:
  # Lint, type-check and every build. The unit tests run beside it in unit-tests; build-and-test below is the one
  # check that is green only when both passed.
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The audio model weights come from upstream hosts (huggingface.co,
      # essentia.upf.edu) that sometimes time out. Restore them from cache and
      # save them right after a successful download, so a later failing step
      # or a flaky host never forces the next run to download them again.
      - name: Restore audio model weights
        id: music-models
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.MUSIC_MODEL_PATHS }}
          key: music-models-${{ hashFiles('public/*-model/manifest.json') }}
          # A PR that edits any manifest gets a new key; fall back to the newest cache so
          # setup:music only fetches what changed instead of everything from upstream hosts.
          restore-keys: music-models-

      - name: Download audio model weights
        if: steps.music-models.outputs.cache-hit != 'true'
        run: npm run setup:music

      - name: Save audio model weights
        if: steps.music-models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.MUSIC_MODEL_PATHS }}
          key: music-models-${{ hashFiles('public/*-model/manifest.json') }}

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build (production)
        run: npm run build

      - name: Build (air-gapped) + verify zero external hosts
        run: npm run build:airgap

      - name: Enforce eager bundle budget
        run: npm run check:bundle

      - name: Build (Windows .exe) + verify icon embedded
        run: |
          npm run build:exe
          file release/win/run.exe | grep -q 'PE32+ executable' || (echo "run.exe is not a valid PE executable" && exit 1)
          test -f release/win/dist/index.html || (echo "dist/ was not staged next to run.exe" && exit 1)
          node -e "
            const ResEdit = require('resedit');
            const fs = require('fs');
            const exe = ResEdit.NtExecutable.from(fs.readFileSync('release/win/run.exe'));
            const res = ResEdit.NtExecutableResource.from(exe);
            const icons = ResEdit.Resource.IconGroupEntry.fromEntries(res.entries);
            const iconCount = icons.reduce((n, g) => n + g.icons.length, 0);
            if (iconCount < 1) { console.error('No icon embedded in run.exe'); process.exit(1); }
            console.log('run.exe has', iconCount, 'embedded icon(s)');
          "
          test -f docker/downloads/Document\ Graph\ Explorer.exe || (echo "exe was not staged for Docker downloads" && exit 1)

  # The unit tests took ~10 of build-and-test's 14 minutes in one job, and ~9 of those were one test: the graph
  # accuracy check on 61 real Python PEPs (src/eval/graphAccuracy.test.ts), which embeds every document with the real
  # model. It gets a machine of its own; the other ~350 test files take about 3 minutes in the job beside it.
  unit-tests:
    name: unit tests (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: all but graph accuracy
            args: --exclude src/eval/graphAccuracy.test.ts
          - part: graph accuracy
            args: src/eval/graphAccuracy.test.ts
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Python for offline rescoring regressions
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install rescoring test dependency
        run: python3 -m pip install numpy==2.3.5

      # Same weights as lint-and-build; tests that read them see the same files. Restore only: lint-and-build saves.
      - name: Restore audio model weights
        id: music-models
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.MUSIC_MODEL_PATHS }}
          key: music-models-${{ hashFiles('public/*-model/manifest.json') }}
          restore-keys: music-models-

      - name: Download audio model weights
        if: steps.music-models.outputs.cache-hit != 'true'
        run: npm run setup:music

      - name: Test
        run: npm test -- ${{ matrix.args }}

  # How much of src/ the unit tests reach. Report only: it is not part of build-and-test and never blocks a merge.
  # It is a job of its own because measuring slows the tests enough that a few time out at the normal 5 s limit, so
  # the pass/fail run above stays unmeasured and this one gets a longer limit (see test:coverage in package.json).
  # It runs the unit suite a second time, so only on pushes to main: pull requests stay on the fast path.
  coverage:
    name: unit test coverage (report only)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Python for offline rescoring regressions
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install rescoring test dependency
        run: python3 -m pip install numpy==2.3.5

      # Same weights as lint-and-build; tests that read them see the same files. Restore only: lint-and-build saves.
      - name: Restore audio model weights
        id: music-models
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.MUSIC_MODEL_PATHS }}
          key: music-models-${{ hashFiles('public/*-model/manifest.json') }}
          restore-keys: music-models-

      - name: Download audio model weights
        if: steps.music-models.outputs.cache-hit != 'true'
        run: npm run setup:music

      - name: Test with coverage
        run: npm run test:coverage -- --exclude src/eval/graphAccuracy.test.ts

      - name: Coverage summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered} / ${t[k].total} |`;
            console.log(["## Unit test coverage (src/)", "", "| | Covered | Count |", "|---|---|---|",
              row("lines"), row("statements"), row("functions"), row("branches")].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          retention-days: 14

  # The Python training, evaluation and tooling scripts: a check for real mistakes (undefined names, unused imports;
  # rules in ruff.toml) and their own test files. Before this job only four of those test files ran, through Vitest.
  python-checks:
    name: python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the checker and NumPy
        run: python3 -m pip install -r scripts/requirements-dev.txt

      - name: Lint
        run: ruff check

      - name: Test
        run: python3 scripts/run_python_tests.py

  # Keeps the single `build-and-test` check, green only when lint, builds, both unit-test parts and the Python
  # checks passed.
  build-and-test:
    if: always()
    needs: [lint-and-build, unit-tests, python-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Require lint, builds, both unit-test parts and the Python checks to pass
        run: test "${{ needs.lint-and-build.result }}" = success && test "${{ needs.unit-tests.result }}" = success && test "${{ needs.python-checks.result }}" = success

  # Whether this change can affect the built app at all. Browser tests and the Docker image only exercise the build,
  # so a PR that touches nothing but documentation, Python training code or other workflows gets the same result as
  # its base and skips them. Every push to main runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.c.outputs.app }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - id: c
        env:
          EVENT: ${{ github.event_name }}
        run: |
          APP=true
          if [ "$EVENT" = pull_request ]; then
            # The PR's merge commit against its base branch tip.
            git diff --name-only HEAD^1 HEAD > changed.txt
            # Anything outside these paths can reach the build, so it runs the full suite.
            grep -vE '^(docs/|[^/]+\.md$|.*\.(py|ipynb)$|\.github/workflows/)' changed.txt > app.txt || true
            # This workflow itself, and the Python the app's dev server starts (the review server and its import), still count.
            grep -xE '\.github/workflows/ci\.yml|scripts/(dj-review-server|dj_pack_import)\.py' changed.txt >> app.txt || true
            [ -s app.txt ] || APP=false
            echo "Files that can affect the app:"; cat app.txt
          fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"; echo "app=$APP"

  # The browser suite takes ~37 min serially, so it runs as four parallel jobs
  # balanced by measured duration (groups are defined in playwright.config.ts).
  e2e-group:
    name: e2e (${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [smoke, collab, graph, rest]
    env:
      E2E_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The audio model weights come from upstream hosts (huggingface.co,
      # essentia.upf.edu) that sometimes time out. Restore them from cache and
      # save them right after a successful download, so a later failing step
      # or a flaky host never forces the next run to download them again.
      - name: Restore audio model weights
        id: music-models
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.MUSIC_MODEL_PATHS }}
          key: music-models-${{ hashFiles('public/*-model/manifest.json') }}
          # A PR that edits any manifest gets a new key; fall back to the newest cache so
          # setup:music only fetches what changed instead of everything from upstream hosts.
          restore-keys: music-models-

      - name: Download audio model weights
        if: steps.music-models.outputs.cache-hit != 'true'
        run: npm run setup:music

      - name: Save audio model weights
        if: steps.music-models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.MUSIC_MODEL_PATHS }}
          key: music-models-${{ hashFiles('public/*-model/manifest.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build (production)
        run: npm run build

      - name: Browser smoke tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.group }}
          path: playwright-report/
          retention-days: 7

  # Keeps a single `e2e` check that is green only when every group passed.
  e2e:
    if: always()
    needs: [changes, e2e-group]
    runs-on: ubuntu-latest
    steps:
      - name: Require every e2e group to pass
        # Skipped only when the changes job ran and found nothing that reaches the app.
        run: |
          test "${{ needs.e2e-group.result }}" = success \
            || { test "${{ needs.changes.result }}" = success && test "${{ needs.changes.outputs.app }}" = false; }

  docker:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # CI exercises the optional audio-enabled image. Restoring the cached
      # weights first (same key as the jobs above) keeps setup off the upstream
      # hosts, which time out on hosted runners now and then.
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Restore audio model weights
        id: music-models
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.MUSIC_MODEL_PATHS }}
          key: music-models-${{ hashFiles('public/*-model/manifest.json') }}
          restore-keys: music-models-

      - name: Download audio model weights
        if: steps.music-models.outputs.cache-hit != 'true'
        run: npm run setup:music

      - name: Save audio model weights
        if: steps.music-models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.MUSIC_MODEL_PATHS }}
          key: music-models-${{ hashFiles('public/*-model/manifest.json') }}

      - name: Build Docker image
        run: docker compose build

      - name: Smoke-test container
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/ >/dev/null; then
              echo "App responded on attempt $i"
              curl -sfI http://127.0.0.1:8080/models/Xenova/bge-small-en-v1.5/config.json | grep -q '200 OK'
              docker compose down
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          docker compose down
          echo "Container never became reachable on :8080" >&2
          exit 1
