name: DJ clip accuracy check

# 500 tag-labelled 10 s OpenMIC-2018 clips (DJ genres first, none used in earlier tuning) plus 500 tempo-labelled 10 s
# excerpts of Beatport EDM (GiantSteps tempo), analysed by this commit's app in headless Chromium. The first run freezes
# and commits both manifests; the score job commits its reports to docs/evaluations/dj-clips-2026-10-06/results.
# Audio is fetched at run time and never committed.
on:
  workflow_dispatch:
    inputs:
      results_dir:
        description: Folder under the docs directory for the reports (keeps earlier runs intact)
        default: results

permissions:
  contents: write

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  OPENMIC: https://zenodo.org/records/1432913/files/openmic-2018-v1.0.0.tgz?download=1
  GIANTSTEPS: https://github.com/GiantSteps/giantsteps-tempo-dataset.git
  GIANTSTEPS_REF: d51ab2422e76abacfaa86616a57054bc222ec9fd   # master on 2026-10-06, the revision the frozen set was built from
  DOCS: docs/evaluations/dj-clips-2026-10-06
  RESULTS: ${{ inputs.results_dir || 'results' }}
  MUSIC_MODEL_PATHS: |
    public/music-model/**/*.onnx
    public/sound-model/**/*.onnx
    public/jamendo-model/*.onnx
    !public/jamendo-model/nsynth_*-discogs-effnet-1.onnx

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        set: [openmic, giantsteps]
    steps:
      - uses: actions/checkout@v4
      - name: Select OpenMIC clips
        if: matrix.set == 'openmic'
        run: |
          curl -fsSL --retry 6 -o "$RUNNER_TEMP/openmic.tgz" "$OPENMIC"
          echo "e4ccf187e2bb5ab2e115416e8aafe7f4  $RUNNER_TEMP/openmic.tgz" | md5sum -c -
          python3 scripts/dj-clips/openmic.py "$RUNNER_TEMP/openmic.tgz" audio
      - name: Select GiantSteps excerpts
        if: matrix.set == 'giantsteps'
        run: |
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)
          git clone -q "$GIANTSTEPS" "$RUNNER_TEMP/gs" && git -C "$RUNNER_TEMP/gs" checkout -q "$GIANTSTEPS_REF"
          python3 scripts/dj-clips/giantsteps.py "$RUNNER_TEMP/gs" audio
      - name: Commit the frozen manifest
        run: |
          git add "$DOCS/${{ matrix.set }}-manifest.json"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Freeze the ${{ matrix.set }} DJ clip set"
            for i in 1 2 3 4; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" \
              && break; [ $i = 4 ] && exit 1; sleep $((2**i)); done
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dj-${{ matrix.set }}-audio
          path: |
            audio
            ${{ env.DOCS }}/${{ matrix.set }}-manifest.json
          retention-days: 7

  eval:
    needs: freeze
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        set: [openmic, giantsteps]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dj-${{ matrix.set }}-audio
          path: clips
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore audio model weights
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MUSIC_MODEL_PATHS }}
          key: music-models-${{ hashFiles('public/*-model/manifest.json') }}
          restore-keys: music-models-
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Analyse in the real app
        run: |
          export CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          AUDIO_DIR=clips/audio AUDIO_EXT=${{ matrix.set == 'openmic' && 'ogg' || 'wav' }} \
            MANIFEST=clips/$DOCS/${{ matrix.set }}-manifest.json SHARD=${{ matrix.shard }}/4 \
            node scripts/short-clip-upload-eval.mjs out/run test 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dj-${{ matrix.set }}-export-${{ matrix.shard }}
          path: out/run/graph-export.json
          retention-days: 30

  score:
    needs: eval
    # Every shard must succeed: a partial run would be scored and committed as if all 1000 clips were analysed.
    if: ${{ !cancelled() && needs.eval.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: dj-*-export-*
          path: exports
      - uses: actions/download-artifact@v4
        with:
          pattern: dj-*-audio
          path: clips
      - name: Score
        run: |
          set -o pipefail
          [[ "$RESULTS" =~ ^[a-z0-9-]+$ ]] || { echo "bad results_dir"; exit 1; }
          R="$DOCS/$RESULTS"; mkdir -p "$R"
          OM=clips/dj-openmic-audio/$DOCS/openmic-manifest.json GS=clips/dj-giantsteps-audio/$DOCS/giantsteps-manifest.json
          node -e "const m=require('./'+process.argv[1]);m.items=m.items.filter(i=>i.djTier==='dj genre');require('fs').writeFileSync('dj-tier.json',JSON.stringify(m))" "$OM"
          MANIFEST=$OM npx vite-node scripts/mixed-music/score.mjs "$R/openmic-tags.json" exports/dj-openmic-export-*/graph-export.json | tee "$R/openmic-tags.txt"
          MANIFEST=dj-tier.json npx vite-node scripts/mixed-music/score.mjs "$R/openmic-tags-dj-genres.json" exports/dj-openmic-export-*/graph-export.json | tee "$R/openmic-tags-dj-genres.txt"
          node scripts/compare-tag-reports.mjs --min-positives 5 "$R/openmic-tags.json" | tee -a "$R/openmic-tags.txt" || true
          node scripts/compare-tag-reports.mjs --min-positives 5 "$R/openmic-tags-dj-genres.json" | tee -a "$R/openmic-tags-dj-genres.txt" || true
          npx vite-node scripts/full-mix/extract.mjs "$R/openmic-clips.json" exports/dj-openmic-export-*/graph-export.json
          MANIFEST=$GS npx vite-node scripts/dj-clips/score-giantsteps.mjs "$R/giantsteps.json" exports/dj-giantsteps-export-*/graph-export.json | tee "$R/giantsteps.txt"
          echo "tested $GITHUB_SHA (run $GITHUB_RUN_ID)" > "$R/tested-commit.txt"
      - name: Commit the reports
        run: |
          git add "$DOCS/$RESULTS"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm "Record DJ clip accuracy results" || exit 0
          for i in 1 2 3 4; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" \
            && break; [ $i = 4 ] && exit 1; sleep $((2**i)); done
