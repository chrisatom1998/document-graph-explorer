name: Full-mix tag check (OpenMIC, main)

# Temporary: analyses the frozen 900-clip OpenMIC test selection (audio artifact from the mixed-music run on
# claude/weak-sound-labels-2phv35) with the current main build, and commits a compact per-clip record so display
# thresholds can be calibrated offline. Audio is never committed.
on:
  push:
    branches: [claude/edm-genre-tags-5qvvso]
    paths: [scripts/full-mix/**, .github/workflows/full-mix-check.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  AUDIO_RUN: '37356488384'
  MUSIC_MODEL_PATHS: |
    public/music-model/**/*.onnx
    public/sound-model/**/*.onnx
    public/jamendo-model/*.onnx
    !public/jamendo-model/nsynth_*-discogs-effnet-1.onnx

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          path: tools
      - run: |
          cp -r tools/scripts/full-mix scripts/full-mix && rm -rf tools && git log -1 --format='app under test: %H %s'
      - uses: actions/download-artifact@v4
        with:
          name: mixed-music-audio
          path: mm
          run-id: ${{ env.AUDIO_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore audio model weights
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MUSIC_MODEL_PATHS }}
          key: music-models-${{ hashFiles('public/*-model/manifest.json') }}
          restore-keys: music-models-
      - run: npm run setup:music
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Analyse in the real app
        run: |
          export CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          AUDIO_DIR=mm/mixed-audio AUDIO_EXT=ogg MANIFEST=mm/docs/evaluations/mixed-music-2026-10-05/manifest.json SHARD=${{ matrix.shard }}/6 \
            node scripts/full-mix/upload-eval.mjs out/run test 25
      - name: Extract
        if: always()
        run: npx vite-node scripts/full-mix/extract.mjs out/extract-${{ matrix.shard }}.json out/run/graph-export.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-mix-main-${{ matrix.shard }}
          path: |
            out/extract-${{ matrix.shard }}.json
            out/run/graph-export.json
          retention-days: 14

  commit:
    needs: eval
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: full-mix-main-*
          path: shards
      - name: Commit the compact records
        run: |
          mkdir -p docs/evaluations/edm-genre-tags-2026-10-05
          node -e "const fs=require('fs');const rows=[];for(const d of fs.readdirSync('shards'))for(const f of fs.readdirSync('shards/'+d))if(f.startsWith('extract-'))rows.push(...JSON.parse(fs.readFileSync('shards/'+d+'/'+f)));fs.writeFileSync('docs/evaluations/edm-genre-tags-2026-10-05/openmic-main.json',JSON.stringify(rows));console.log(rows.length,'clips')"
          git add docs/evaluations/edm-genre-tags-2026-10-05/openmic-main.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Full-mix check: OpenMIC records from main"
          for i in 1 2 3 4; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break; sleep $((2**i)); done
