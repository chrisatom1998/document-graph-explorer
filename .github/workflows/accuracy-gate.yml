name: Accuracy gate

# Blocks a PR whose held-out sound tag, tempo or key numbers drop below its base branch's (beyond noise), once
# "Accuracy gate / held-out / verdict" is a required check. PRs run a fixed fast slice (150 of the 500 Jamendo tracks,
# all 318 MTG key tracks); main runs the full set, one merge at a time (merges that land while a run is going are
# skipped except the newest), and caches its results as the baseline for later PRs. The "full-accuracy-check" label
# runs the full set on a PR (accuracy-gate-full.yml).
# Details: docs/evaluations/accuracy-gate.md.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # GitHub drops a cache that has not been restored for 7 days. Main's own gate is the only run that
  # writes the shared audio cache. Monday 06:15 UTC re-runs the full set and re-saves this commit's baseline.
  # That cron shares the main concurrency group, so a busy day can drop it; accuracy-gate-cache.yml restores
  # the audio every day and is what keeps the 7-day window. A quiet stretch (13 days, as of 2026-10-30) is
  # what made every PR re-download Jamendo from cdn.freesound.org.
  schedule:
    - cron: '15 6 * * 1'
  # Actions → Accuracy gate → Run workflow, on main, after this file is on main. Same full set as a push.
  # This is the run that refills a cache that has already expired.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A PR's newer push cancels its older run. Pushes to main share one queue: the run in flight finishes (its numbers
  # become a baseline), and of the merges that land meanwhile only the newest waits; GitHub drops the older pending
  # ones. Main's full run is report-only and takes over an hour, so analysing every merge left several 14-job runs
  # queued at once, and PRs (whose required verdict needs runners from the same pool) waited behind them.
  group: accuracy-gate-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  held-out:
    uses: ./.github/workflows/accuracy-gate-run.yml
    with:
      mode: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'fast' }}
