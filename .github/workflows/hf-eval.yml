name: Accuracy test on Hugging Face Jobs

# Runs one evaluation task (scripts/hf-eval/tasks/<task>.sh) on Hugging Face Jobs instead of GitHub-hosted runners,
# so long accuracy runs don't hold up PR CI. The task is split into `parts` parallel HF jobs; each checks out this
# harness and the app under test (app_ref), runs the task and uploads its results (never audio) to the private
# dataset <HF user>/dge-eval-runs. This workflow then downloads them, runs the task's collect step here, reports
# wall-clock and cost (hf-cost.json, job summary) and commits the results to results_branch when given.
# Billed to the HF_TOKEN account: it refuses to start when parts x timeout x price could pass max_cost.
# A push that changes scripts/hf-eval/request.json on a claude/hf-eval-* branch runs the request in that file.
on:
  workflow_dispatch:
    inputs:
      task: { description: 'task name under scripts/hf-eval/tasks', required: true, default: 'all-tags-jamendo' }
      app_ref: { description: 'branch, tag or commit whose app to test', default: 'main' }
      task_args: { description: 'passed to the task as TASK_ARGS', default: '' }
      parts: { description: 'parallel HF jobs', default: '8' }
      flavor: { description: 'HF Jobs hardware (cpu-upgrade: 8 vCPU, $0.03/h)', default: 'cpu-upgrade' }
      timeout: { description: 'time limit per job', default: '2h' }
      max_cost: { description: 'refuse to start if the worst case could pass this many USD', default: '1' }
      results_branch: { description: 'branch to commit results to (empty: artifact only)', default: '' }
      rescore: { description: 'run key of an earlier run to score again without starting jobs (e.g. loops-37457305060-1)', default: '' }
  push:
    branches: ['claude/hf-eval-*']
    paths: ['scripts/hf-eval/request.json']

permissions:
  contents: write

concurrency:
  group: hf-eval-${{ github.ref_name }}-${{ inputs.task || github.sha }}-${{ inputs.app_ref || '' }}
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - name: Read the request
        env:
          IN: ${{ toJSON(inputs) }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = push ]; then cp scripts/hf-eval/request.json req.json; else echo "$IN" > req.json; fi
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os, re
          r = json.load(open('req.json'))
          d = {'task': '', 'app_ref': 'main', 'task_args': '', 'parts': '8', 'flavor': 'cpu-upgrade', 'timeout': '2h', 'max_cost': '1', 'results_branch': '', 'rescore': ''}
          d.update({k: str(v) for k, v in r.items() if v not in (None, '')})
          assert re.fullmatch(r'[a-z0-9-]+', d['task']) and os.path.isfile(f"scripts/hf-eval/tasks/{d['task']}.sh"), 'task must be a name under scripts/hf-eval/tasks'
          assert re.fullmatch(r'[a-z0-9-]*', d['rescore']), 'rescore must be a run key such as loops-37457305060-1'
          for k, v in d.items(): assert '\n' not in v; print(f'{k.upper()}={v}')
          PY
      - name: Resolve the app under test
        run: |
          git fetch -q origin "$APP_REF" 2>/dev/null && SHA=$(git rev-parse FETCH_HEAD) || SHA=$(git rev-parse "$APP_REF")
          echo "APP_SHA=$SHA" >> "$GITHUB_ENV"
          echo "RUN_KEY=${RESCORE:-$TASK-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          git worktree add -q --detach app "$SHA" && git -C app log -1 --format='app under test: %H %s'
      - name: Run on Hugging Face Jobs
        env: { HF_TOKEN: '${{ secrets.HF_TOKEN }}' }
        run: |
          [ -n "$HF_TOKEN" ] || { echo "::error::Add a Hugging Face token as the repository secret HF_TOKEN"; exit 1; }
          pip install -q huggingface_hub==2.1.1
          python3 scripts/hf-eval/launch.py "$TASK" "$PARTS" "$FLAVOR" "$TIMEOUT" "$MAX_COST" "$RUNNER_TEMP/parts" \
            APP_SHA=$APP_SHA HARNESS_SHA=$GITHUB_SHA RUN_KEY=$RUN_KEY TASK_ARGS="$TASK_ARGS" RESCORE="$RESCORE"
      - name: Stop the Hugging Face jobs if this workflow is cancelled
        if: ${{ cancelled() }}
        env: { HF_TOKEN: '${{ secrets.HF_TOKEN }}' }
        run: |
          [ -f hf-job-ids ] && python3 -c "from huggingface_hub import cancel_job; [cancel_job(job_id=j) for j in open('hf-job-ids').read().split()]" || true
      - name: Collect
        id: collect
        run: |
          R=docs/evaluations/hf-eval/$TASK/$(echo "$APP_REF" | tr -c 'A-Za-z0-9._\n-' '-' | cut -c1-40)-${APP_SHA::7}-$GITHUB_RUN_ID
          echo "R=$R" >> "$GITHUB_ENV"; mkdir -p "$R"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          WORK=$RUNNER_TEMP HARNESS=$PWD APP=$PWD/app bash scripts/hf-eval/tasks/$TASK.sh collect "$RUNNER_TEMP/parts" "$PWD/$R"
          cp "$RUNNER_TEMP/parts/hf-cost.json" "$R/"
      # Only once collect succeeded: after a failed collect the exports stay in the private dataset so the run can be
      # re-scored (rescore: <run key>) instead of re-analysed; re-run with a fix and they are deleted then.
      - name: Delete per-track exports of a held-out set from the HF dataset
        if: ${{ always() && env.RUN_KEY != '' && steps.collect.outcome == 'success' }}
        env: { HF_TOKEN: '${{ secrets.HF_TOKEN }}' }
        run: |
          grep -q '^# HELD_OUT=1' "scripts/hf-eval/tasks/$TASK.sh" || exit 0
          python3 -c "import sys; from huggingface_hub import HfApi; a = HfApi(); a.delete_folder(f'runs/{sys.argv[1]}', repo_id=a.whoami()['name'] + '/dge-eval-runs', repo_type='dataset', commit_message='Delete held-out per-track exports')" "$RUN_KEY" || true
          rm -rf "$RUNNER_TEMP/parts"/part-*
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: hf-eval-${{ env.TASK }}
          path: |
            ${{ env.R }}
            ${{ runner.temp }}/parts/hf-cost.json
            ${{ runner.temp }}/parts/logs
          retention-days: 90
      - name: Commit the results
        if: ${{ env.RESULTS_BRANCH != '' && env.RESULTS_BRANCH != github.event.repository.default_branch }}
        run: |
          git fetch -q origin "$RESULTS_BRANCH" && git worktree add -q rb FETCH_HEAD
          mkdir -p "rb/$R" && cp -r "$R/." "rb/$R/" && cd rb && git add "$R"
          git commit -qm "HF eval $TASK on $APP_REF (${APP_SHA::7}), run $GITHUB_RUN_ID" || exit 0
          for i in 1 2 3 4; do git push -q origin "HEAD:$RESULTS_BRANCH" && break; [ $i = 4 ] && exit 1; sleep $((2**i)); git pull -q --rebase origin "$RESULTS_BRANCH"; done
