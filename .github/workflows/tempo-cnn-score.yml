name: Tempo model, score the finished browser shards

# Chris stopped the browser check (run 37442285929) with 6 of its 8 shards done; this scores those shards as they are.
on:
  push:
    branches: [claude/fix-triplet-tempo-lkxolu]
    paths: [.github/workflows/tempo-cnn-score.yml]

permissions:
  contents: write
  actions: read

env:
  R1: docs/evaluations/dj-clips-2026-10-06/giantsteps-manifest.json
  R2: docs/evaluations/dj-clips-round2-2026-10-06/mtg-key-manifest.json
  OUT: docs/evaluations/tempo-cnn-2026-10-06/browser

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - uses: actions/download-artifact@v7
        with:
          pattern: tempo-*-export-*
          path: exports
          run-id: 37442285929
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Score
        run: |
          set -o pipefail
          mkdir -p "$OUT"
          MANIFEST=$R1 BENCHMARK=dj-clips-2026-10-06/giantsteps@tempo-cnn \
            npx vite-node scripts/dj-clips/score-giantsteps.mjs "$OUT/round1.json" exports/tempo-round1-export-*/graph-export.json | tee "$OUT/round1.txt"
          MANIFEST=$R2 BENCHMARK=dj-clips-round2-2026-10-06/mtg-key@tempo-cnn \
            npx vite-node scripts/dj-clips/score-giantsteps.mjs "$OUT/round2.json" exports/tempo-round2-export-*/graph-export.json | tee "$OUT/round2.txt"
          echo "app 7baacbc (run 37442285929, stopped with 6 of 8 shards done)" > "$OUT/tested-commit.txt"
      - name: Commit the reports
        run: |
          git add "$OUT"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm "Record the browser check of the tempo model (6 of 8 shards)" || exit 0
          for i in 1 2 3 4; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" \
            && break; [ $i = 4 ] && exit 1; sleep $((2**i)); done
