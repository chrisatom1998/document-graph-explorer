name: Voice veto before/after on the DJ clip tests

# Judges the full-mix voice veto (docs/evaluations/all-tags-2026-10-06/PREREGISTRATION.md) on both DJ clip tests by
# re-scoring their saved graph exports with main's display (6c230ef, after #132) and this branch's. Judge-only.
on:
  workflow_dispatch:
  push:
    branches: [claude/fix-failing-sound-tags-nc73z1]
    paths: [.github/workflows/all-tags-voice-judge.yml]

permissions:
  contents: write
  actions: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  R1_RUN: '37396016931'
  R2_RUN: '37406166208'
  MAIN_REF: 6c230ef
  DOCS: docs/evaluations/all-tags-2026-10-06

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          pattern: dj-*-export-*
          path: r1
          run-id: ${{ env.R1_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v7
        with:
          pattern: dj2-*-export-*
          path: r2
          run-id: ${{ env.R2_RUN }}
          github-token: ${{ github.token }}
      - name: Score with main's display and with this branch's
        run: |
          set -o pipefail
          J="$DOCS/judge"; mkdir -p "$J"
          M1=docs/evaluations/dj-clips-2026-10-06 M2=docs/evaluations/dj-clips-round2-2026-10-06
          score() {   # $1 = main|branch
            O="$J/$1"; mkdir -p "$O"
            MANIFEST=$M1/openmic-manifest.json npx vite-node scripts/mixed-music/score.mjs "$O/r1-openmic-tags.json" r1/dj-openmic-export-*/graph-export.json | tee "$O/r1-openmic-tags.txt"
            MANIFEST=$M2/openmic-manifest.json npx vite-node scripts/mixed-music/score.mjs "$O/r2-openmic-tags.json" r2/dj2-openmic-export-*/graph-export.json | tee "$O/r2-openmic-tags.txt"
            MANIFEST=$M1/giantsteps-manifest.json npx vite-node scripts/dj-clips/score-giantsteps.mjs "$O/r1-giantsteps.json" r1/dj-giantsteps-export-*/graph-export.json | tee "$O/r1-giantsteps.txt"
            MANIFEST=$M2/mtg-key-manifest.json BENCHMARK=dj-clips-round2-2026-10-06/mtg-key npx vite-node scripts/dj-clips/score-giantsteps.mjs "$O/r2-mtgkey.json" r2/dj2-mtgkey-export-*/graph-export.json | tee "$O/r2-mtgkey.txt"
            npx vite-node scripts/dj-fix/extract.mjs "$O/r1-openmic-records.json" r1/dj-openmic-export-*/graph-export.json
            npx vite-node scripts/dj-fix/extract.mjs "$O/r2-openmic-records.json" r2/dj2-openmic-export-*/graph-export.json
          }
          score branch
          git checkout "$MAIN_REF" -- src
          score main
          git checkout HEAD -- src
          echo "branch $GITHUB_SHA vs main $MAIN_REF (run $GITHUB_RUN_ID)" > "$J/tested-commit.txt"
      - name: Commit
        run: |
          git add "$DOCS/judge"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm "Record voice veto before/after on the DJ clip tests" || exit 0
          for i in 1 2 3 4; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" \
            && break; [ $i = 4 ] && exit 1; sleep $((2**i)); done
