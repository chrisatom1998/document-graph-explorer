name: DJ clip round 2, re-score

# Re-scores round 2's saved app exports (no re-analysis) with the current scorers, so the committed reports match them.
# Exports come from the round 2 run on main (37406166208) and the PR #116 tempo-fix run (37408031481).
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-unl6fy]
    paths: [.github/workflows/dj-clips-round2-rescore.yml]

permissions:
  contents: write
  actions: read

env:
  DOCS: docs/evaluations/dj-clips-round2-2026-10-06
  MAIN_RUN: '37406166208'
  FIX_RUN: '37408031481'

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          pattern: dj2-*-export-*
          path: exports
          run-id: ${{ env.MAIN_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v7
        with:
          pattern: fix-mtgkey-export-*
          path: exports
          run-id: ${{ env.FIX_RUN }}
          github-token: ${{ github.token }}
      - name: Score
        run: |
          set -o pipefail
          R="$DOCS/results"; OM=$DOCS/openmic-manifest.json MK=$DOCS/mtg-key-manifest.json
          test $(ls exports/dj2-openmic-export-*/graph-export.json | wc -l) = 4
          test $(ls exports/dj2-mtgkey-export-*/graph-export.json | wc -l) = 4
          test $(ls exports/fix-mtgkey-export-*/graph-export.json | wc -l) = 4
          node -e "const m=require('./'+process.argv[1]);m.items=m.items.filter(i=>i.djTier==='dj genre');require('fs').writeFileSync('dj-tier.json',JSON.stringify(m))" "$OM"
          MANIFEST=$OM BENCHMARK=dj-clips-round2-2026-10-06/openmic npx vite-node scripts/mixed-music/score.mjs "$R/openmic-tags.json" exports/dj2-openmic-export-*/graph-export.json | tee "$R/openmic-tags.txt"
          MANIFEST=dj-tier.json BENCHMARK=dj-clips-round2-2026-10-06/openmic-dj-genres npx vite-node scripts/mixed-music/score.mjs "$R/openmic-tags-dj-genres.json" exports/dj2-openmic-export-*/graph-export.json | tee "$R/openmic-tags-dj-genres.txt"
          node scripts/compare-tag-reports.mjs --min-positives 5 "$R/openmic-tags.json" | tee -a "$R/openmic-tags.txt" || true
          node scripts/compare-tag-reports.mjs --min-positives 5 "$R/openmic-tags-dj-genres.json" | tee -a "$R/openmic-tags-dj-genres.txt" || true
          MANIFEST=$MK BENCHMARK=dj-clips-round2-2026-10-06/mtg-key npx vite-node scripts/dj-clips/score-giantsteps.mjs "$R/mtg-key.json" exports/dj2-mtgkey-export-*/graph-export.json | tee "$R/mtg-key.txt"
          MANIFEST=$MK BENCHMARK=dj-clips-round2-2026-10-06/mtg-key@pr116 npx vite-node scripts/dj-clips/score-giantsteps.mjs "$R/tempo-fix-116/mtg-key.json" exports/fix-mtgkey-export-*/graph-export.json | tee "$R/tempo-fix-116/mtg-key.txt"
          echo "re-scored with scorers at $GITHUB_SHA (run $GITHUB_RUN_ID)" > "$R/rescored.txt"
      - name: Commit the reports
        run: |
          git add "$DOCS/results"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm "Re-score round 2 DJ clip reports with the final scorers" || exit 0
          for i in 1 2 3 4; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" \
            && break; [ $i = 4 ] && exit 1; sleep $((2**i)); done
