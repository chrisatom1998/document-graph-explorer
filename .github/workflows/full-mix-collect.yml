name: Full-mix records collect (temporary)

on:
  push:
    branches: [claude/edm-genre-tags-5qvvso]
    paths: [.github/workflows/full-mix-collect.yml]

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: full-mix-main-*
          path: shards
          run-id: '37363307518'
          github-token: ${{ github.token }}
      - name: Commit the compact records
        run: |
          node -e "const fs=require('fs');const rows=[];for(const d of fs.readdirSync('shards'))for(const f of fs.readdirSync('shards/'+d))if(f.startsWith('extract-'))rows.push(...JSON.parse(fs.readFileSync('shards/'+d+'/'+f)));fs.writeFileSync('docs/evaluations/edm-genre-tags-2026-10-05/openmic-main.json',JSON.stringify(rows));console.log(rows.length,'clips')"
          git add docs/evaluations/edm-genre-tags-2026-10-05/openmic-main.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Full-mix check: all OpenMIC records from main"
          git push -q origin "HEAD:$GITHUB_REF_NAME"
