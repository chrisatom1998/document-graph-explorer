name: Benchmark tooling
on:
  pull_request:
    paths:
      - 'scripts/benchmarks/**'
      - 'src/audio/**'
      - 'package*.json'
      - '.github/workflows/benchmark-tooling.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/benchmarks/**'
      - 'src/audio/**'
      - 'package*.json'
      - '.github/workflows/benchmark-tooling.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:benchmarks
      - name: Lint benchmark scripts
        run: npx eslint scripts/benchmarks
      - name: Verify scoring against the shipped display policy
        run: npx vite-node scripts/benchmarks/display.check.mjs
