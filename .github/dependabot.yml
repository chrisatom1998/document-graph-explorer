# Monthly dependency update PRs, kept few because each one runs the
# accuracy gate. Minor and patch updates are grouped per ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      # Pinned to the build @huggingface/transformers bundles. Bumping it alone
      # ships two ONNX runtimes; move it only together with transformers.
      - dependency-name: onnxruntime-web
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
