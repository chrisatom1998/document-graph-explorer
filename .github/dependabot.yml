version: 2

updates:
  # Grouped so routine version bumps arrive as a couple of reviewable PRs a
  # week rather than one per package — this tree has ~840 packages, and a
  # per-package flood is how dependency PRs end up ignored.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # three is pinned exactly: @react-three/fiber and drei track specific
      # three versions, and a floating bump breaks the scene at runtime rather
      # than at build time. Update it deliberately, not on a schedule.
      - dependency-name: three
        update-types: [version-update:semver-minor, version-update:semver-patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
